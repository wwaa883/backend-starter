services:
  mysql:
    image: mysql:8.4
    container_name: starter-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: demo
      TZ: Asia/Shanghai
    ports:
      # 宿主机 3306 已被本机 MySQL84 服务占用，这里映射到 3307
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p123456']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starter-api
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: 123456
      DB_NAME: demo
      PORT: 3000
    ports:
      # 宿主机 3000 可能被本地 dev 占用，这里映射到 3001
      - '3001:3000'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
